name: Garder Streamlit Actif

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up Streamlit App
        run: |
          python - << 'EOF'
          import requests
          url = "https://app-traiteur-jklhjbvej8rwdg4t32zypk.streamlit.app/"
          print(f"Tentative de réveil de : {url}")
          try:
              response = requests.get(url, timeout=90)
              print(f"Réponse reçue, code statut : {response.status_code}")
          except Exception as e:
              print(f"Erreur lors du ping : {e}")
              exit(1)
          EOF
